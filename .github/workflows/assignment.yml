name: Deploy website and build assignment
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      student_name:
        description: 'PDF에 표시할 이름'
        required: true
        type: string
      student_id:
        description: 'PDF에 표시할 학번'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: pages-assignment
  cancel-in-progress: false
jobs:
  check:
    name: Verify website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check report scripts
        run: python -m py_compile scripts/build_report.py scripts/check_site.py
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright opencv-python-headless numpy
          python -m playwright install --with-deps chromium
      - name: Check local functionality
        run: python scripts/check_site.py
  deploy:
    name: Publish GitHub Pages
    needs: check
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
  evidence:
    name: Capture website and create PDF
    if: github.event_name == 'workflow_dispatch'
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Read and mask PDF identity
        uses: actions/github-script@v8
        with:
          script: |
            const name = context.payload.inputs.student_name;
            const id = context.payload.inputs.student_id;
            core.setSecret(name);
            core.setSecret(id);
            core.exportVariable('STUDENT_NAME', name);
            core.exportVariable('STUDENT_ID', id);
      - name: Install Korean font and report dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-nanum
          python -m pip install reportlab pillow pypdf playwright opencv-python-headless pymupdf requests
          python -m playwright install --with-deps chromium
      - name: Capture deployed website and build PDF
        run: python scripts/build_report.py
        env:
          SITE_URL: ${{ needs.deploy.outputs.page_url }}
      - name: Upload submission PDF
        uses: actions/upload-artifact@v7
        with:
          name: 6week-assignment-pdf
          path: outputs/6week_assignment.pdf
          archive: false
          if-no-files-found: error
          retention-days: 90
      - name: Upload screenshots and verification
        uses: actions/upload-artifact@v7
        with:
          name: screenshots-and-validation
          path: work/evidence
          if-no-files-found: error
          retention-days: 90
